 if(/өрт|апат|авар|жол-көлік|соқтығыс|жедел жәрдем|дәрі қобди|өрт сөндір/.test(t)) return FA;

 if(/белдік|қауіпсіздік бел|балалар|бала ұстағыш|жолаушы/.test(t)) return BELT;
 if(/құжат|куәлік|сақтандыру|полис/.test(t)) return DOC;

 return WARN;

var PRACTICE_PACKS = [{"ctx":["қала көшесінде қозғалыс тығыз болғанда","жолда ауа райы күрт өзгергенде","бейтаныс бағытпен жүргенде","жол белгілері бірнешеу болып кездескенде","жолда уақытша кедергі пайда болғанда","кешкі уақытта қозғалыс азайғанда","жол жабыны біркелкі болмағанда","көріну қашықтығы қысқарғанда","жолда балалар жүрген аумаққа жақындағанда","ұзақ сапарға шығар алдында"],"a":["Жол белгілерін, таңбаларды және жағдайды ескеріп, қауіпсіз қозғалу.","Өз ыңғайыма қарай ережелерді елемеу.","Басқа көліктерге қарап, өз бетімше шешім қабылдау."],"ar":["Учитывать знаки, разметку и обстановку, двигаться безопасно.","Игнорировать правила, если так удобнее.","Ориентироваться только на действия других машин."],"e":"Жол қозғалысына қатысушы әрдайым ережені сақтап, жағдайға сай қауіпсіз шешім қабылдауы керек.","er":"Участник движения должен соблюдать правила и выбирать безопасное решение с учётом обстановки."},{"ctx":["жолға шығар алдында","ұзақ сапарға дайындалғанда","көлік басқаруды басқа адамға берерде","жолда полиция қызметкері тоқтатқанда","көлікте ақау белгісі байқалғанда","жүргізуші шаршағанын сезгенде","құжаттарды тексеру қажет болғанда","жолаушы қауіпсіздік белдігін тақпағанда","көлікке балалар мінгенде","жол-көлік оқиғасына куә болғанда"],"a":["Көліктің жарамдылығын, қажетті құжаттарды және өзінің жүргізуге дайын күйін тексеру.","Тексерусіз жолға шығып, ақауды кейін қарау.","Қауіпсіздік талаптарын тек ұзақ сапарда орындау."],"ar":["Проверить исправность автомобиля, документы и собственную готовность к управлению.","Начать движение без проверки, а неисправность устранить позже.","Соблюдать требования безопасности только в дальней поездке."],"e":"Жүргізуші жолға шығар алдында көліктің техникалық күйін және өзінің қауіпсіз басқаруға дайындығын тексеруі тиіс.","er":"Перед поездкой водитель должен проверить техническое состояние автомобиля и свою готовность безопасно управлять им."},{"ctx":["тротуар жоқ жолда жүргенде","жолды белгіленбеген жерден кесіп өтпек болғанда","қараңғы уақытта жол жиегімен жүргенде","жаяу жүргінші өткеліне жақындағанда","бағдаршаммен реттелетін өткелде тұрғанда","жолда балалар тобымен жүргенде","велосипед жолымен қиылысқан жерде","қоғамдық көлік аялдамасынан шыққанда","көлік жолға жақын тоқтағанда","тайғақ жолда жолдан өтпек болғанда"],"a":["Қозғалыс қауіпсіздігін бағалап, белгіленген өткелді пайдалану және көлікке кедергі келтірмеу.","Жақын көлік болса да жүгіріп өту.","Көлік жүргізушісі міндетті түрде тоқтайды деп ойлау."],"ar":["Оценить безопасность, пользоваться обозначенным переходом и не создавать помех.","Перебегать дорогу даже перед близким автомобилем.","Считать, что водитель обязан остановиться в любой ситуации."],"e":"Жаяу жүргінші жолдан қауіпсіз жерде, мүмкіндігінше белгіленген өткелмен өтуі керек.","er":"Пешеход должен переходить дорогу в безопасном месте, по возможности используя обозначенный переход."},{"ctx":["көлік қозғалысқа шығар алдында","көлікке отырар кезде","көліктен түсер алдында","баламен бірге сапарға шыққанда","қоғамдық көлік ішінде тұрғанда","есікті ашпақ болғанда","қауіпсіздік белдігі бар орындыққа отырғанда","көлік толық тоқтамай тұрғанда","жүргізушіге кедергі келтіретін әрекет жасағысы келгенде","жүкпен бірге салонға кіргенде"],"a":["Жүргізушінің нұсқауын орындап, белдікті тағып, қауіпсіздік тәртібін сақтау.","Қозғалыс кезінде еркін орын ауыстыру.","Жүргізушіні әңгімемен немесе әрекетпен алаңдату."],"ar":["Выполнять указания водителя, пристегнуться и соблюдать правила безопасности.","Свободно перемещаться во время движения.","Отвлекать водителя разговорами или действиями."],"e":"Жолаушы қауіпсіздік белдігін тағып, жүргізушіге кедергі жасамауы және көлік толық тоқтаған соң ғана түсуі керек.","er":"Пассажир должен пристегнуться, не отвлекать водителя и выходить только после полной остановки."},{"ctx":["бағдаршамның қызыл сигналы жанғанда","жасыл сигнал жыпылықтай бастағанда","сары сигнал қосылғанда","қосымша секциядағы көрсеткі жанғанда","бағдаршам істемей қалғанда","реттеуші қолын жоғары көтергенде","реттеуші мен бағдаршам нұсқауы қайшы келгенде","қиылысқа кірген соң сигнал ауысқанда","жасыл сигналда қиылыстың арғы жағы бос болмағанда","жаяу жүргіншіге арналған сигнал жанғанда"],"a":["Бағдаршам мен реттеушінің нұсқауын сақтап, қиылысқа тек шығатын жол бос әрі қауіпсіз болса кіру.","Сигналды елемей, жылдамдықты арттыру.","Қиылыста басқа көліктерге қарап кезексіз жүру."],"ar":["Соблюдать сигналы светофора и регулировщика, въезжать только если выезд свободен и безопасен.","Игнорировать сигнал и ускориться.","Проезжать перекрёсток без очереди, ориентируясь на другие машины."],"e":"Сигналдар қозғалыс тәртібін анықтайды; реттеушінің нұсқауы басым, ал кептелген қиылысқа кіруге болмайды.","er":"Сигналы определяют порядок движения; указания регулировщика имеют приоритет, а въезжать на заблокированный перекрёсток нельзя."},{"ctx":["көк және қызыл маягы бар жедел қызмет көлігі жақындағанда","дыбыстық арнайы сигнал қосылған көлік арттан келгенде","жедел жәрдем қиылысқа жақындағанда","өрт сөндіру көлігі тар көшеде келе жатқанда","полиция көлігі арнайы сигналмен қозғалғанда","арнайы көлік кептелісте келе жатқанда","жедел көлік жаяу өткелге жақындағанда","арнайы сигналды көлік қарсы бағыттан келгенде","арнайы көлік бұрылыс жасамақ болғанда","арнайы көлік жол жиегімен өткенде"],"a":["Қауіпсіз түрде жол беріп, оның қозғалысына кедергі келтірмеу.","Оның соңынан ілесіп, кептелістен өту.","Жол бермеу, себебі өз жолағымда келе жатырмын."],"ar":["Безопасно уступить дорогу и не препятствовать его движению.","Следовать за ним, чтобы объехать пробку.","Не уступать, поскольку я нахожусь в своей полосе."],"e":"Арнайы сигналы қосылған жедел қызмет көлігіне қауіпсіз жол беру қажет.","er":"Транспортному средству оперативной службы с включёнными спецсигналами необходимо безопасно уступить дорогу."},{"ctx":["жол-көлік оқиғасынан кейін","көлік мәжбүрлі түрде тоқтағанда","түнде жол жиегінде тоқтауға тура келгенде","көріну нашар жолда тоқтағанда","көлік жолдың жүру бөлігінде бұзылғанда","апаттық тоқтау белгісін қою қажет болғанда","көлік басқа жүргізушілерге қауіп төндіріп тұрғанда","жолаушыларды қауіпсіз жерге шығару қажет болғанда","жолда кедергі пайда болғанда","авариялық жағдайдан кейін көлікті тоқтатқанда"],"a":["Апаттық жарық сигналын қосып, қауіпсіздік шараларын орындап, белгіленген тәртіппен ескерту белгісін қою.","Көлікті жарықсыз қалдырып, оқиға орнынан кету.","Тек дыбыс сигналын беріп, еш белгі қоймау."],"ar":["Включить аварийную сигнализацию, принять меры безопасности и выставить знак в установленном порядке.","Оставить автомобиль без огней и покинуть место.","Только подать звуковой сигнал и не выставлять знак."],"e":"Мәжбүрлі тоқтау кезінде басқа қатысушыларды ескертіп, оқиға орнын қауіпсіз ету керек.","er":"При вынужденной остановке нужно предупредить других участников и обеспечить безопасность места."},{"ctx":["оңға бұрылмас бұрын","солға бұрылмас бұрын","жолақ ауыстырғанда","кері бұрылуды жоспарлағанда","артқа жүргенде","жол жиегінен қозғалысқа қосылғанда","тоқтаған жерден қозғалғанда","айналма қозғалысқа кіргенде","кедергіні айналып өткенде","жолдың шетіне жақындағанда"],"a":["Маневрді алдын ала көрсетіп, айналаны тексеріп, басқа қатысушыларға жол беріп, қауіпсіз орындау.","Бұрылыс көрсеткішін маневр аяқталған соң қосу.","Айнаға қарамай бірден маневр жасау."],"ar":["Заранее обозначить манёвр, проверить обстановку, уступить другим и выполнить его безопасно.","Включить указатель поворота после завершения манёвра.","Маневрировать сразу, не проверяя зеркала."],"e":"Кез келген маневр алдын ала белгіленіп, қауіпсіздік пен басымдық ережелері сақталуы керек.","er":"Любой манёвр нужно заранее обозначить и выполнять с соблюдением безопасности и правил приоритета."},{"ctx":["көпжолақты жолда жүргенде","жолақ саны азайғанда","жолдың оң жақ шетінде кедергі болғанда","бір бағыттағы жолда қозғалғанда","қарсы бағыттағы көлікпен кездескенде","жолақтар арасында таңба болғанда","жол жиегіне жақындағанда","қоғамдық көлік жолағы бар көшеде жүргенде","жолдың тар бөлігінен өткенде","көлік ағыны тығыз болғанда"],"a":["Жолақ таңбаларын және белгілерді сақтап, өз жолағында қауіпсіз орналасу.","Қалаған жолақпен ескертусіз қозғалу.","Қарсы бағыт жолағын бос болса да тұрақты пайдалану."],"ar":["Соблюдать разметку и знаки, безопасно занимать предназначенную полосу.","Перестраиваться в любую полосу без предупреждения.","Постоянно использовать встречную полосу, если она свободна."],"e":"Көлік құралы жолақтарда таңба мен белгілерге сәйкес орналасуы тиіс.","er":"Транспортное средство должно располагаться на полосах в соответствии с разметкой и знаками."},{"ctx":["жаңбыр жауып тұрғанда","тұман түскенде","мектеп маңынан өткенде","елді мекенге кіргенде","жол жөндеу учаскесіне жақындағанда","көктайғақта жүргенде","көлік ағыны тығыз болғанда","көріну қашықтығы азайғанда","бұрылысы шектеулі жолда жүргенде","жол жабыны құрғақ әрі бос болғанда"],"a":["Белгіленген шектен аспай, жол мен көріну жағдайына сай қауіпсіз жылдамдық таңдау.","Жол бос болса, кез келген жылдамдықпен жүру.","Алдыңғы көлікке ілесіп, оның жылдамдығын қайталау."],"ar":["Не превышать установленный предел и выбирать безопасную скорость с учётом дороги и видимости.","Ехать с любой скоростью, если дорога свободна.","Повторять скорость автомобиля впереди."],"e":"Жылдамдық тек белгіге емес, жол, ауа райы, көріну және көлік жағдайына да сай болуы керек.","er":"Скорость должна учитывать не только знак, но и состояние дороги, погоду, видимость и транспорт."},{"ctx":["қарсы жолақта көлік көрінгенде","жаяу жүргінші өткеліне жақындағанда","темір жол өткеліне таяғанда","жолдың көрінуі шектеулі бұрылысында","алдыңғы көлік басып озуды бастағанда","тұтас таңбалау сызығы бар учаскеде","қиылысқа жақындағанда","көпір немесе тоннель ішінде","жол тайғақ болғанда","басып озу аяқталған соң өз жолағыңа қайтқанда"],"a":["Басып озудың рұқсат етілгеніне және толық қауіпсіз екеніне көз жеткізу; тыйым салынған жерде маневр жасамау.","Қарсы жолақ бос сияқты көрінсе, кез келген жерде басып озу.","Басып озылатын көлік жылдамдығын арттырса да маневрді жалғастыру."],"ar":["Убедиться, что обгон разрешён и полностью безопасен; не выполнять его в запрещённых местах.","Обгонять в любом месте, если встречная полоса кажется свободной.","Продолжать манёвр, даже если обгоняемый автомобиль ускоряется."],"e":"Басып озу тек рұқсат етілген және қарсы бағыттағы қозғалысқа қауіп төндірмейтін жағдайда жасалады.","er":"Обгон выполняется только там, где он разрешён и не создаёт опасности встречному движению."},{"ctx":["жаяу жүргінші өткеліне жақындағанда","қиылыстың жанында тоқтағанда","көпір үстінде тұрақ іздегенде","қоғамдық көлік аялдамасына жақындағанда","жолдың тар бөлігінде тоқтағанда","еңіс жерде тұраққа қойғанда","көліктен түсер алдында","екінші қатарға қоюды ойлағанда","жол белгісі тұрақты шектеген жерде","көлік бұзылып тоқтағанда"],"a":["Тоқтау мен тұраққа рұқсат етілген орынды таңдап, басқа қатысушыларға кедергі келтірмеу.","Қысқа уақытқа болса да кез келген жерде қою.","Көлікті жолақтың ортасында қалдыру."],"ar":["Выбрать разрешённое место остановки или стоянки и не мешать другим участникам.","Останавливаться где угодно, если ненадолго.","Оставить автомобиль посреди полосы."],"e":"Тоқтау және тұрақ жол белгілері мен ережелерге сай, қозғалысқа кедергі келтірмейтін жерде орындалуы тиіс.","er":"Остановка и стоянка должны выполняться в разрешённом месте, не создавая помех движению."},{"ctx":["тең дәрежелі қиылысқа жақындағанда","екінші дәрежелі жолдан шыққанда","айналма қиылысқа кіргенде","солға бұрылмақ болғанда","оңға бұрылмақ болғанда","бағдаршам істемей тұрғанда","қиылыстың арғы жағы кептелгенде","реттеуші қозғалысты басқарып тұрғанда","қиылыста трамваймен кездескенде","басты жол бағыты өзгерген қиылыста"],"a":["Басымдықты анықтап, тиісті қатысушыларға жол беріп, қиылысқа тек шығатын жол бос болса кіру.","Қиылысқа бірінші болып жылдам кіру.","Оң жақтағы және қарсы бағыттағы көліктерді елемеу."],"ar":["Определить приоритет, уступить соответствующим участникам и въезжать только при свободном выезде.","Как можно быстрее въехать первым.","Не учитывать транспорт справа и встречного направления."],"e":"Қиылыста басымдық белгілермен, бағдаршаммен, реттеушімен және жалпы өту тәртібімен анықталады.","er":"Приоритет на перекрёстке определяется знаками, светофором, регулировщиком и общими правилами проезда."},{"ctx":["жаяу жүргінші өткеліне жақындағанда","аялдамада автобус тұрған кезде","жаяу жүргінші жолға қадам басқанда","мектеп жанындағы өткелде","велосипед жолы қиылысқанда","жаяу жүргінші өткелі алдында көлік тоқтағанда","аялдама маңында жолаушылар түсіп жатқанда","реттелмейтін өткелде","жолдың екі жағында көріну шектеулі болғанда","жаяу жүргінші аралшасында"],"a":["Жылдамдықты азайтып, өткелдегі адамдарға жол беру және аялдама маңында аса сақ болу.","Дыбыс сигналын беріп, тоқтамай өту.","Алдыңғы көлік тоқтаса, оны айналып өту."],"ar":["Снизить скорость, уступить пешеходам и быть особенно внимательным у остановки.","Подать звуковой сигнал и проехать без остановки.","Объехать впереди остановившийся автомобиль."],"e":"Өткелде жаяу жүргіншіге жол беріледі; аялдама маңында жолаушылардың күтпеген әрекетін ескеру қажет.","er":"На переходе пешеходам уступают дорогу; у остановок нужно учитывать возможные неожиданные действия пассажиров."},{"ctx":["шлагбаум түсіп келе жатқанда","қызыл сигнал жыпылықтағанда","шлагбаумсыз өткелге жақындағанда","пойыз дыбысы естілгенде","рельс үстінде кептеліс пайда болғанда","темір жол өткелінде көлік бұзылғанда","пойыз жақындап келе жатқанда","кезекші тоқтау белгісін бергенде","рельстен өтіп бара жатқанда","өткелден кейін жол бос болмағанда"],"a":["Өткелге кірмей тоқтап, пойыздың өтуін күту; рельске тоқтап қалу қаупін болдырмау.","Шлагбаум жабылмай тұрып үлгеру үшін жылдам өту.","Пойыз көрінбесе, сигналға қарамау."],"ar":["Не въезжать на переезд, остановиться и дождаться поезда; не допускать остановки на рельсах.","Ускориться, чтобы успеть до закрытия шлагбаума.","Игнорировать сигнал, если поезд не виден."],"e":"Темір жол өткелінде сигнал мен шлагбаум талаптарын қатаң сақтау қажет.","er":"На железнодорожном переезде необходимо строго соблюдать сигналы и требования шлагбаума."},{"ctx":["автомагистральға кіргенде","автомагистральда тоқтау қажет болғанда","жылдамдық жолағына қосылғанда","автомагистральдан шығуға жақындағанда","жолда кері бұрылғысы келгенде","жаяу жүргінші автомагистраль маңында болғанда","көлік бұзылып қалған кезде","автомагистральда артқа жүру қажет сияқты көрінгенде","жолақ ауыстырғанда","ұзақ сапарда демалыс қажет болғанда"],"a":["Автомагистральға тән шектеулерді сақтап, тек рұқсат етілген жерлерде тоқтау және маневр жасау.","Жолдың кез келген жерінде тоқтап, кері бұрылу.","Жаяу жүргіншілер мен баяу көліктерге арналған жолақпен жүру."],"ar":["Соблюдать ограничения автомагистрали, останавливаться и маневрировать только в разрешённых местах.","Останавливаться и разворачиваться в любом месте.","Двигаться по полосам для пешеходов и тихоходного транспорта."],"e":"Автомагистральда қозғалысқа арнайы талаптар қойылады; кері жүру мен рұқсатсыз тоқтауға болмайды.","er":"На автомагистрали действуют специальные требования; движение задним ходом и остановка в неположенном месте запрещены."},{"ctx":["тұрғын ауласына кіргенде","балалар аулада ойнап жүргенде","жаяу жүргіншілер көп жерде","тұрғын аймақтан шыққанда","аула ішінде артқа жүргенде","тұрғын аймақта тұраққа қойғанда","велосипедшімен кездескенде","үй кіреберісіне жақындағанда","ауладағы тар жолда","тұрғын аймақта дыбыс сигналын қолданғысы келгенде"],"a":["Төмен жылдамдықпен жүріп, жаяу жүргіншілерге басымдық беріп, қауіпсіздікке ерекше назар аудару.","Аула бос көрінсе, жоғары жылдамдықпен жүру.","Жаяу жүргіншілерді дыбыс сигналымен ығыстыру."],"ar":["Двигаться с низкой скоростью, уступать пешеходам и быть особенно внимательным.","Ехать быстро, если двор кажется свободным.","Вытеснять пешеходов звуковым сигналом."],"e":"Тұрғын аймақта жаяу жүргіншілерге басымдық беріледі және жылдамдық шектеледі.","er":"В жилой зоне пешеходы имеют преимущество, а скорость движения ограничена."},{"ctx":["автобус аялдамадан қозғалғанда","маршруттық көлік жолағына жақындағанда","трамваймен бір бағытта жүргенде","автобус бұрылыс жасағанда","қоғамдық көлік аялдамасына кіргенде","маршруттық көлік жолақтан шыққанда","трамвай жолын кесіп өткенде","автобус жолағы белгіленген көшеде","қоғамдық көлік кептелістен шыққанда","аялдамада жолаушылар мінгенде"],"a":["Белгілер мен жолақ тәртібін сақтап, қоғамдық көлікке қатысты басымдық ережелерін орындау.","Қоғамдық көлікке ешқашан жол бермеу.","Белгіленген автобус жолағын рұқсатсыз пайдалану."],"ar":["Соблюдать знаки и режим полос, выполнять правила приоритета общественного транспорта.","Никогда не уступать общественному транспорту.","Использовать выделенную автобусную полосу без разрешения."],"e":"Қоғамдық көлікке қатысты басымдық пен арнайы жолақтар белгілермен және қозғалыс ережелерімен реттеледі.","er":"Приоритет общественного транспорта и специальные полосы регулируются знаками и правилами движения."},{"ctx":["түнде жарықтандырылмаған жолда жүргенде","қарсы көлік жақындағанда","тұман түскенде","туннельге кіргенде","күндіз көріну нашарлағанда","дыбыс сигналын қолдану қажет болғанда","елді мекенде жаяу жүргіншіге жақындағанда","көлік тоқтап тұрғанда","қарсы көлік жүргізушісін жарық шағылыстырғанда","жаңбырлы күні жолда жүргенде"],"a":["Жол жағдайына сай жарықты дұрыс пайдаланып, басқа жүргізушілерді көз қарықтырудан сақтану.","Алыс жарықты барлық жағдайда қосып жүру.","Дыбыс сигналын ескерту емес, асықтыру үшін қолдану."],"ar":["Правильно использовать свет с учётом условий и не ослеплять других водителей.","Всегда ездить с дальним светом.","Использовать звуковой сигнал для поторапливания, а не предупреждения."],"e":"Сыртқы жарық аспаптары көрінуді жақсарту үшін қолданылады, бірақ басқа қатысушыларды көз қарықтырмауы тиіс.","er":"Внешние световые приборы улучшают видимость, но не должны ослеплять других участников."},{"ctx":["көлікті икемді тіркемемен сүйрегенде","қатты тіркемемен сүйрегенде","сүйретілетін көліктің тежегіші істемегенде","сүйреу алдында тіркеуді тексергенде","сүйреу кезінде бұрылыс жасағанда","сүйреу кезінде жол тайғақ болғанда","сүйреу кезінде жарық сигналдарын қолданғанда","тіркеме ажырап кету қаупі болғанда","сүйреу бағытын жоспарлағанда","сүйретілетін көлік жүргізушісі байланыс жасағанда"],"a":["Сүйреу ережелерін, тіркеу қауіпсіздігін және белгіленген шектеулерді сақтау.","Арқанды тексермей, кез келген жылдамдықпен сүйреу.","Сүйретілетін көлікте жүргізуші қажет емес деп есептеу."],"ar":["Соблюдать правила буксировки, безопасность сцепки и установленные ограничения.","Буксировать с любой скоростью, не проверяя трос.","Считать, что в буксируемом автомобиле водитель не нужен."],"e":"Сүйреу тек жарамды тіркеу құралымен және қауіпсіздік талаптарын сақтай отырып орындалады.","er":"Буксировка выполняется с исправным сцепным устройством и соблюдением требований безопасности."},{"ctx":["оқу көлігімен қала көшесіне шыққанда","жаттығу алаңында маневр жасағанда","нұсқаушы тапсырма бергенде","оқушы жүргізуші қиылысқа жақындағанда","оқу көлігінің төбесінде белгі тұрғанда","жолақ ауыстыруды үйренгенде","артқа жүру жаттығуында","жаяу жүргінші өткеліне жақындағанда","емтихан кезінде қателік жасағанда","оқу сапары аяқталғанда"],"a":["Нұсқаушының бақылауымен, оқу тәртібі мен барлық жол қозғалысы ережелерін сақтап жүргізу.","Оқу көлігі болғандықтан жол ережесін елемеу.","Нұсқаушының нұсқауынсыз күрделі маневр жасау."],"ar":["Управлять под контролем инструктора, соблюдая учебный порядок и все ПДД.","Игнорировать правила, поскольку автомобиль учебный.","Выполнять сложные манёвры без указаний инструктора."],"e":"Оқу жүргізуі де жалпы жол қозғалысы ережелеріне бағынады және нұсқаушы бақылауымен орындалады.","er":"Учебное вождение также подчиняется общим ПДД и проводится под контролем инструктора."},{"ctx":["балаларды жеңіл көлікпен тасымалдағанда","жолаушылар толық отырмаған кезде","жолаушы есікті ашпақ болғанда","көлік қозғалысқа шығар алдында","жолаушылар көп болғанда","жолаушы жүкпен бірге отырған кезде","автобуста жолаушы тұрғанда","көлік аялдамада тоқтағанда","жолаушы қауіпсіздік белдігін тақпағанда","көлікке міну және түсу кезінде"],"a":["Жолаушылар санын және қауіпсіздік құралдарын талапқа сай қамтамасыз етіп, есіктердің жабылғанын тексеру.","Рұқсат етілген саннан артық жолаушы алу.","Қозғалыс кезінде жолаушыға мінуге немесе түсуге рұқсат ету."],"ar":["Обеспечить допустимое число пассажиров и средства безопасности, проверить закрытие дверей.","Брать пассажиров сверх разрешённого количества.","Разрешать посадку или высадку во время движения."],"e":"Жолаушыларды тасымалдау кезінде орын саны, белдік және қауіпсіз міну-түсу талаптары сақталуы тиіс.","er":"При перевозке пассажиров нужно соблюдать число мест, требования к ремням и безопасной посадке/высадке."},{"ctx":["жүк көлікке тиелгенде","жүк кузовқа орналастырылғанда","ұзын жүк тасымалдағанда","жүк көлік шетінен шығып тұрғанда","жүк көлік ішінде бекітілгенде","жол бұрылыстарынан өткенде","жүк көріністі жауып қалуы мүмкін болғанда","жүк құлап кету қаупі туғанда","қауіпті жүк тасымалдағанда","көлікке жүк тиеу аяқталғанда"],"a":["Жүкті мықтап бекітіп, салмақ пен өлшем талаптарын сақтап, көрініс пен басқаруға кедергі келтірмеу.","Жүкті бекітпей, қысқа қашықтыққа жүре беру.","Жүк жүргізушінің көрінісін жапса да қозғалу."],"ar":["Надёжно закрепить груз, соблюдать ограничения массы и габаритов, не закрывать обзор и управление.","Ехать без крепления груза, если путь короткий.","Продолжать движение, даже если груз закрывает обзор водителю."],"e":"Жүк қозғалыс кезінде жылжымайтындай бекітіліп, көлікті басқаруға және көрініске кедергі келтірмеуі керек.","er":"Груз должен быть закреплён так, чтобы не перемещаться и не мешать управлению и обзору."},{"ctx":["велосипедші жолдың жүру бөлігіне шыққанда","мопедпен қозғалысқа қосылғанда","велосипед жолы аяқталғанда","жолда мал айдап келе жатқанда","велосипедші қиылыстан өткенде","мопед жүргізушісі бұрылыс жасағанда","велосипед пен көлік қатар жүргенде","жаяу жүргінші жолымен қиылысқанда","велосипедті түнде басқарғанда","жол жиегінде ат арба жүргенде"],"a":["Өз санатына арналған жолмен қозғалып, көрінуді қамтамасыз етіп, басқа қатысушыларға қауіп төндірмеу.","Жол ережелерін сақтамай, көлік ағынына қарсы жүру.","Жарық шағылыстырғышсыз қараңғыда жүру."],"ar":["Двигаться по предназначенной для категории дороге, быть заметным и не создавать опасности.","Ехать против потока, не соблюдая правила.","Двигаться в темноте без световозвращателей."],"e":"Велосипед, мопед және мал айдау кезінде тиісті жолақ, жабдық және қауіпсіздік талаптары сақталуы қажет.","er":"При движении на велосипеде, мопеде или перегоне животных нужно соблюдать требования к маршруту, оснащению и безопасности."},{"ctx":["мүгедектігі бар адамға арналған тұрақ орнына жақындағанда","арба пайдаланатын адам өткелге шыққанда","көлік аялдамасында арнайы орын болғанда","тротуарда кедергі пайда болғанда","пандус маңында көлік тоқтатпақ болғанда","арнайы белгісі бар көлік тұрған жерде","жаяу жүргінші өткелінде қозғалыс баяу болғанда","мүгедектігі бар жолаушыны түсіргенде","арнайы тұрақ белгісі қойылғанда","тротуардың қолжетімді жолын бос қалдыру қажет болғанда"],"a":["Арнайы орындарды заңды негізсіз иеленбей, қолжетімді жол мен өткелді бос қалдыру.","Арнайы тұрақ орнын кез келген көлікке пайдалануға беру.","Пандус пен тротуарды көлікпен жауып қою."],"ar":["Не занимать специальные места без законного основания и оставлять доступные пути свободными.","Разрешать любому автомобилю занимать специальное место.","Перекрывать пандус и тротуар автомобилем."],"e":"Арнайы тұрақ пен қолжетімділік инфрақұрылымы тиісті адамдарға кедергісіз пайдалануға қалдырылуы керек.","er":"Специальные парковочные места и доступная инфраструктура должны оставаться доступными для тех, кому они предназначены."},{"ctx":["ескерту белгісін көргенде","тыйым салу белгісіне жақындағанда","міндеттеу белгісі қойылғанда","басымдық белгісі бар қиылысқа кіргенде","ақпараттық белгіге кезіккенде","уақытша жол белгісі орнатылғанда","белгінің астында қосымша тақтайша болғанда","жол белгісі көрінбей қалған жағдайда","бірнеше белгі қатар қойылғанда","белгі әрекет ететін аймақтан шыққанда"],"a":["Белгінің мағынасын және қосымша тақтайшасын ескеріп, көрсетілген талапты орындау.","Белгілерді тек жол бос кезде ғана орындау.","Белгінің түсіне қарап өздігінен басқа мағына беру."],"ar":["Учитывать значение знака и дополнительной таблички, выполнять указанное требование.","Соблюдать знаки только при свободной дороге.","Самостоятельно менять значение знака по его цвету."],"e":"Жол белгілері түріне қарай ескерту, тыйым салу, міндеттеу немесе ақпарат беру қызметін атқарады.","er":"Дорожные знаки в зависимости от вида предупреждают, запрещают, предписывают или информируют."},{"ctx":["тұтас сызыққа жақындағанда","үзік сызықпен бөлінген жолақта жүргенде","тоқтау сызығына жақындағанда","жаяу жүргінші өткелінің таңбасын көргенде","бағыт көрсеткісі салынған жолақта","сары таңбалау бар учаскеде","жолақ шекарасы өзгергенде","уақытша таңбалау қойылғанда","жол жиегіндегі сызыққа жақындағанда","бірнеше таңба қатар кездескенде"],"a":["Жол таңбасының талабын сақтап, сызықты тек рұқсат етілген әрі қауіпсіз жағдайда кесіп өту.","Тұтас сызықты жол бос болса кез келген уақытта кесу.","Таңбалауды тек түнде ғана ескеру."],"ar":["Соблюдать требования разметки и пересекать линии только там, где это разрешено и безопасно.","Пересекать сплошную линию в любое время, если дорога свободна.","Учитывать разметку только ночью."],"e":"Жол таңбасы жолақтарды, тоқтау орындарын және қозғалыс бағыттарын белгілейді; оның талабын сақтау міндетті.","er":"Разметка обозначает полосы, места остановки и направления движения; её требования обязательны."},{"ctx":["жолға шығар алдында тежегішті тексергенде","шинаның протекторы тозғанын байқағанда","жарық шамы істемей қалғанда","әйнек тазалағыш бұзылғанда","руль басқаруы ақау бергенде","қауіп function dvH(t,a,i){var s='<'+t;for(var k in a)s+=' '+k+'="'+a[k]+'"';return s+(i===undefined?'/>':'>'+i+'</'+t+'>')}
function dvBld(side,x1,x2,t1,t2,b1,b2,col){

    var P=function(u,v){var x=x1+(x2-x1)*u,t=t1+(t2-t1)*u,b=b1+(b2-b1)*u;return x+','+(t+(b-t)*v)};

  L.forEach(function(l,i){var on=c===l[1]||(c==='flash'&&i===2);o+=dvH('circle',{cx:-157,cy:12+i*36,r:15,fill:on?l[0]:'#2a2a2a'});if(on)o+=dvH('circle',{cx:-157,cy:12+i*36,r:48,fill:l[0],opacity:.3})});

function dvSign(x,y,s,kind,txt){var o='<g transform="translate('+x+' '+y+') scale('+s+')">'+dvH('rect',{x:-3,y:30,width:6,height:170,fill:'#333'});

  else if(kind==='oct')o+=dvH('polygon',{points:'-14,-34 14,-34 34,-14 34,14 14,34 -14,34 -34,14 -34,-14',fill:'#d62020',stroke:'#fff','stroke-width':3})+dvH('text',{x:0,y:7,'text-anchor':'middle','font-size':17,'font-weight':700,fill:'#fff'},'STOP');

function dvKind(qi){

  if(/туннел|тоннел/.test(t))k.tun=1;
  if(/қиылыс|оң жақтан|сол жақтан/.test(t)||ti===12)k.xr=1;
  if(/басып оз|қарсы|сызық|таңба/.test(t)||ti===10||ti===26)k.ov=1;

  if(/тұру|тұрақ|тоқтауға|тоқтап тұр/.test(t)||ti===11){k.park=1;if(/тыйым/.test(t))k.nop=1}
  if(/белдік|жолаушы|ұстағыш/.test(t)||ti===3||ti===21)k.belt=1;

  if(k.rail){k.ped=0;k.park=0;k.nop=0;k.kid=0;k.xr=0}
